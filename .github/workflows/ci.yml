name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check module files are tidy
        run: go mod tidy -diff

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Test repeated-upload page
        run: node --test web/drop-page/app.test.cjs

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.1"
          install-go: false

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          repo-checkout: false
          go-version-file: go.mod
          go-package: ./...
          cache-dependency-path: go.sum

  actions-lock:
    name: Verify actions lockfile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify .github/workflows/actions.lock
        run: gh actions-lock --verify

  collect:
    needs: [checks, govulncheck, actions-lock]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check results
        run: |
          results=("${{ needs.checks.result }}" "${{ needs.govulncheck.result }}" "${{ needs.actions-lock.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more jobs failed"
              exit 1
            fi
          done
          echo "All jobs passed"
